spring.application.name=barbearia-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barbearia}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
# Para esta etapa de estudo, preserva os dados ao reiniciar.
# Em producao, substituir por migracoes versionadas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}

# Depois de criar as tabelas, adiciona a regra de horários do PostgreSQL.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Mantém o bloco SQL inteiro, pois ele contém ponto e vírgula internamente.
spring.sql.init.separator=@@
